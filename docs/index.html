  * { box-sizing: border-box; }

  .fl-plate[data-view="terminal"] > .fl-svg { display: none !important; }

  .fl-gridline { fill: none; stroke: var(--fl-grid); stroke-width: 1; }
  .fl-node > .box {
    fill: color-mix(in srgb, var(--hue, var(--fl-edge)) 8%, var(--fl-panel));
    stroke: color-mix(in srgb, var(--hue, var(--fl-edge)) 38%, var(--fl-edge));
    stroke-width: 1.5;
  }
  .fl-node .ic { fill: none; stroke: var(--hue, var(--fl-muted)); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .fl-node .t { fill: var(--fl-text); font-weight: 600; }
  .fl-node .s { fill: var(--fl-muted); }
  .fl-node, .fl-edge { transition: opacity 0.5s cubic-bezier(0.32, 0.72, 0, 1); }
  .fl-node[data-hidden], .fl-edge[data-hidden] { opacity: 0.12; }
  .fl-node[data-on] > .box {
    stroke: var(--hue, var(--fl-edge-on)); stroke-width: 2;
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--hue, var(--fl-edge-on)) 45%, transparent));
  }
  .fl-node[data-warm][data-on] > .box { stroke: var(--fl-warm); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--fl-warm) 50%, transparent)); }
  .fl-node[data-warm][data-on] .t { fill: var(--fl-warm); }

  .fl-edge .line { fill: none; stroke: var(--fl-edge); stroke-width: 2; }
  .fl-edge .head { fill: var(--fl-edge); }
  .fl-edge .track { fill: none; stroke: none; }
  .fl-edge[data-dashed] .line { stroke-dasharray: 6 6; }
  .fl-edge[data-on] .line { stroke: var(--fl-edge-on); }
  .fl-edge[data-on] .head { fill: var(--fl-edge-on); }
  .fl-edge[data-warm][data-on] .line { stroke: var(--fl-warm); }
  .fl-edge[data-warm][data-on] .head { fill: var(--fl-warm); }
  .fl-num circle { fill: var(--fl-badge); stroke: var(--fl-plate); stroke-width: 2; }
  .fl-num text { fill: var(--fl-badge-text); font: 700 11px var(--fl-font); }

  .fl-chip rect { fill: var(--fl-panel); stroke: var(--fl-edge); }
  .fl-chip text { fill: var(--fl-muted); font-weight: 500; }
  .fl-chip[data-on] rect { fill: color-mix(in srgb, var(--hue, var(--fl-edge-on)) 16%, var(--fl-panel)); stroke: var(--hue, var(--fl-edge-on)); }
  .fl-chip[data-on] text { fill: var(--fl-text); }
  .fl-screen { fill: var(--fl-screen); stroke: var(--fl-grid); }
  .fl-scr-h { fill: var(--fl-muted); font: 600 11.5px var(--fl-mono); letter-spacing: 0.06em; }
  .fl-scr { fill: var(--fl-text); font: 14px var(--fl-mono); }
  .fl-status rect { fill: var(--fl-warm-bg); stroke: var(--fl-warm); }
  .fl-status text { fill: var(--fl-warm); font: 600 11.5px var(--fl-font); }
  .fl-packet { fill: var(--fl-packet); filter: drop-shadow(0 0 4px var(--fl-glow)); }
  .fl-packet[data-warm] { fill: var(--fl-warm); filter: drop-shadow(0 0 4px var(--fl-warm)); }

  /* ---------- terminal view ---------- */
  .fl-crt {
    position: relative; overflow: hidden; container-type: inline-size;
    padding: clamp(8px, 2.2vw, 20px); border-radius: 8px; font-family: var(--fl-mono);
    background: radial-gradient(120% 100% at 50% 45%, #0d2214 0%, var(--crt-panel) 60%, var(--crt-bg) 100%);
    box-shadow: 0 0 0 1px var(--crt-line);
  }
  .fl-crt[hidden] { display: none; }
  /* static scanlines: an animated overlay doubles paint cost on phones */
  .fl-crt::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, #0000002e 0 1px, transparent 1px 3px),
      radial-gradient(130% 100% at 50% 50%, transparent 62%, #000000a0 100%);
  }
  .fl-pre {
    margin: 0; font: inherit; line-height: 1.2; white-space: pre; overflow: hidden; color: var(--crt-line);
    font-size: clamp(6px, calc(100cqw / (var(--cols, 74) * 0.62)), 18px);
  }
  .fl-pre span[data-s="on"] { color: var(--crt-on); text-shadow: 0 0 6px #5cff9d88; }
  .fl-pre span[data-s="idle"] { color: var(--crt-dim); }
  .fl-pre span[data-s="hid"] { color: var(--crt-hid); }
  .fl-pre span[data-s="scr"] { color: var(--crt-on); }
  .fl-pre span[data-s="warm"] { color: var(--crt-warm); text-shadow: 0 0 6px #ffd16688; }
  .fl-pre span[data-s="pk"] { color: var(--crt-hot); text-shadow: 0 0 8px var(--crt-text); }
  .fl-pre span[data-s="pkw"] { color: #ffe08a; text-shadow: 0 0 8px var(--crt-warm); }
  .fl-typed { margin-top: 10px; min-height: 2.8em; font-size: clamp(11px, 1.8vw, 14px); color: var(--crt-on); text-shadow: 0 0 6px #5cff9d66; }
  .fl-typed::after { content: "\258C"; color: var(--crt-text); animation: fl-blink 1.06s steps(1, end) infinite; }
  @keyframes fl-blink { 50% { opacity: 0; } }

  /* ---------- steps and caption ---------- */
  .fl-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .fl-steps button {
    display: flex; gap: 8px; align-items: center; text-align: left; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--fl-muted); background: var(--fl-panel);
    border: 1px solid var(--fl-grid); border-radius: 6px; padding: 6px 10px;
  }
  .fl-steps button:hover { border-color: var(--fl-edge); color: var(--fl-text); }
  .fl-steps button:focus-visible, .fl-knife:focus-visible { outline: 2px solid var(--fl-edge-on); outline-offset: 2px; }
  .fl-steps button[data-on] { color: var(--fl-text); border-color: var(--fl-edge-on); box-shadow: inset 0 0 0 1px var(--fl-edge-on); }
  .fl-n {
    display: inline-grid; place-items: center; width: 20px; height: 20px; flex: none; border-radius: 50%;
    background: var(--fl-badge); color: var(--fl-badge-text); font-size: 11px; font-weight: 700;
  }
  .fl-caption { margin: 0; min-height: 3.2em; max-width: 72ch; font-size: 15px; line-height: 1.5; }
  /* in the terminal the caption is typed on the screen; keep it for screen readers only */
  .fl-caption[data-view="terminal"] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- knife switch (view toggle) ---------- */
  .fl-knife {
    display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px; cursor: pointer;
    font: 600 12px var(--fl-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fl-muted);
    background: transparent; border: 1px solid var(--fl-grid); border-radius: 6px;
  }
  .fl-knife:hover { border-color: var(--fl-edge); }
  .fl-knife svg { width: 84px; height: 45px; display: block; }
  .fl-kl { transition: color 0.3s; }
  .fl-knife[aria-checked="false"] .fl-kl[data-side="scheme"],
  .fl-knife[aria-checked="true"] .fl-kl[data-side="terminal"] { color: var(--fl-text); }
  .k-base { fill: var(--fl-panel); stroke: var(--fl-edge); }
  .k-screw, .k-pin { fill: var(--fl-muted); }
  .k-jaw rect, .k-hinge { fill: var(--fl-screen); stroke: var(--fl-edge); stroke-width: 0.8; }
  .fl-knife[aria-checked="false"] .k-jaw[data-side="scheme"] rect,
  .fl-knife[aria-checked="true"] .k-jaw[data-side="terminal"] rect { stroke: var(--fl-edge-on); }
  .k-blade { transform-box: view-box; transform-origin: 60px 43px; transform: rotate(-37deg); transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1); }
  .fl-knife[aria-checked="true"] .k-blade { transform: rotate(37deg); }
  .k-blade rect { fill: var(--fl-muted); stroke: var(--fl-edge); stroke-width: 0.6; }
  .k-blade .k-handle { fill: var(--fl-warm); stroke: none; }
  .k-spark { fill: #fff7d6; opacity: 0; transform-box: fill-box; transform-origin: center; filter: drop-shadow(0 0 6px var(--fl-warm)); }
  .k-spark.go { animation: fl-spark 0.45s ease-out 0.28s; }
  @keyframes fl-spark { 0% { opacity: 0.95; transform: scale(0.4); } 100% { opacity: 0; transform: scale(1.6); } }

  @media (prefers-reduced-motion: reduce) {
    .fl-node, .fl-edge, .k-blade, .fl-kl { transition: none; }
    .k-spark.go, .fl-typed::after { animation: none; }
  }
</style>

<body>
<main class="page">
  <h2 class="page-title">How Hermes talks in MAX</h2>
  <p class="page-lede">One message, six steps — from your phone to the agent and back. Click a step to replay it.</p>
  <figure class="flow" id="max-flow"></figure>
</main>

<script>
/* =====================================================================
   1. THE DIAGRAM — edit this. Every word on the figure lives here.
   ===================================================================== */
const DIAGRAM = {
  label: 'Animated diagram: a message written in the MAX app reaches the MAX Bot API, the plugin\'s transport (long polling or a webhook) saves its place and passes it on; inbound checks the sender and fetches media; Hermes thinks while a typing indicator shows, voice notes go to a speech-to-text provider, and the answer streams back through outbound formatting and a rate limiter.',
  idle: 'WAITING FOR MESSAGES',
  stepWord: 'STEP',
  stepsAria: 'Diagram steps',
  stepSeconds: 7,
  holdSeconds: 14,
  switcher: { scheme: 'Diagram', aria: 'Diagram view' },

  nodes: {
    user: { title: 'MAX app', sub: 'you, on a phone', icon: 'phone', group: 'client' },
    maxapi: { title: 'MAX Bot API', sub: 'platform-api2.max.ru', icon: 'cloud', group: 'ext' },
    transport: { title: 'Transport', sub: 'long poll · webhook', icon: 'queue', group: 'edge' },
    state: { title: 'State', sub: 'marker · dedup', icon: 'db', group: 'data' },
    inbound: { title: 'Inbound', sub: 'sender · media', icon: 'shield', group: 'edge' },
    hermes: { title: 'Hermes Agent', icon: 'bot', group: 'core', always: true, screen: true,
              chips: ['pair', 'think', 'reply'], status: 'waiting for you' },
    stt: { title: 'Speech-to-text', sub: 'SpeechKit · Salute', icon: 'chat', group: 'ext', from: 5 },
    outbound: { title: 'Outbound', sub: 'HTML · uploads', icon: 'send', group: 'core', from: 1 },
    limiter: { title: 'Rate limiter', sub: '30/s · 2/s per chat', icon: 'bolt', group: 'data', from: 1 },
  },

  edges: {
    'in-user': { num: true, arrows: 'both' },
    'to-transport': {},
    'to-state': { dashed: true, arrows: 'both' },
    'to-inbound': {},
    'to-hermes': { from: 1, num: true },
    'to-outbound': { from: 1 },
    'to-limiter': { from: 1, num: true },
    'to-max': { from: 1 },
    'to-stt': { from: 5, num: true, arrows: 'both' },
  },

  layouts: {
    wide: {
      w: 960, h: 520,
      nodes: {
        user: { x: 24, y: 40, w: 170, h: 60 },
        maxapi: { x: 24, y: 210, w: 170, h: 100 },
        state: { x: 242, y: 24, w: 170, h: 56 },
        transport: { x: 242, y: 120, w: 170, h: 60 },
        inbound: { x: 460, y: 120, w: 170, h: 60 },
        hermes: { x: 690, y: 80, w: 246, h: 300 },
        outbound: { x: 460, y: 340, w: 170, h: 60 },
        limiter: { x: 242, y: 340, w: 170, h: 60 },
        stt: { x: 690, y: 436, w: 246, h: 60 },
      },
      edges: {
        'in-user': [[109, 100], [109, 210]],
        'to-transport': [[194, 240], [218, 240], [218, 150], [242, 150]],
        'to-state': [[327, 120], [327, 80]],
        'to-inbound': [[412, 150], [460, 150]],
        'to-hermes': [[630, 150], [690, 150]],
        'to-outbound': [[690, 370], [630, 370]],
        'to-limiter': [[460, 370], [412, 370]],
        'to-max': [[242, 370], [218, 370], [218, 280], [194, 280]],
        'to-stt': [[813, 380], [813, 436]],
      },
    },
    tall: {
      w: 420, h: 700, numbers: false, packet: 5,
      nodes: {
        user: { x: 10, y: 10, w: 180, h: 52 },
        maxapi: { x: 220, y: 10, w: 180, h: 52 },
        state: { x: 6, y: 96, w: 92, h: 52 },
        transport: { x: 120, y: 96, w: 180, h: 52 },
        inbound: { x: 120, y: 182, w: 180, h: 52 },
        hermes: { x: 16, y: 268, w: 380, h: 230 },
        stt: { x: 10, y: 530, w: 180, h: 52 },
        outbound: { x: 220, y: 530, w: 180, h: 52 },
        limiter: { x: 220, y: 616, w: 180, h: 52 },
      },
      edges: {
        'in-user': [[190, 36], [220, 36]],
        'to-transport': [[310, 62], [310, 79], [210, 79], [210, 96]],
        'to-state': [[120, 122], [98, 122]],
        'to-inbound': [[210, 148], [210, 182]],
        'to-hermes': [[210, 234], [210, 268]],
        'to-stt': [[100, 498], [100, 530]],
        'to-outbound': [[310, 498], [310, 530]],
        'to-limiter': [[310, 582], [310, 616]],
        'to-max': [[400, 642], [412, 642], [412, 36], [400, 36]],
      },
    },
  },

  steps: [
    {
      title: 'A message arrives',
      text: 'MAX hands the message to the plugin by long polling (or a webhook). Its place is saved first, so a restart never reads it twice or loses one.',
      run(f) {
        if (f.flow('in-user', 0.2, 1.1) || f.at(1.1)) f.lit('user', 'in-user');
        if (f.flow('to-transport', 1.2, 2.1) || f.at(2.1)) f.lit('maxapi', 'to-transport', 'transport');
        if (f.flow('to-state', 2.2, 2.9) || f.at(2.9)) f.lit('to-state', 'state');
        if (f.flow('to-inbound', 3.0, 3.8) || f.at(3.8)) f.lit('to-inbound', 'inbound');
        f.screen('LONG POLL', f.t < 2.9 ? '1 update · chat 4242' : 'marker 1042 saved · 1 update');
      },
    },
    {
      title: 'A stranger gets a code',
      text: 'Hermes decides who may talk to it. A new person gets a pairing code for the owner to approve, and the server downloads nothing they sent.',
      run(f) {
        f.chip(0);
        f.lit('inbound');
        if (f.flow('to-hermes', 0.2, 1.0) || f.at(1.0)) f.lit('to-hermes');
        f.flow('to-outbound', 1.8, 2.5);
        f.flow('to-limiter', 2.5, 3.1);
        f.flow('to-max', 3.1, 3.9);
        f.flow('in-user', 3.9, 4.7, { reverse: true });
        if (f.at(2.5)) f.lit('outbound', 'to-outbound');
        if (f.at(3.1)) f.lit('limiter', 'to-limiter');
        if (f.at(3.9)) f.lit('to-max', 'maxapi');
        if (f.at(4.7)) f.lit('user', 'in-user');
        f.screen('NEW SENDER', f.t < 1.6 ? 'id 4815 · not on the list' : 'pairing code K7Q2-9FX4 sent');
      },
    },
    {
      title: 'Typing while it thinks',
      text: 'While the agent works, the plugin shows "typing…" in MAX every two seconds — Hermes keeps it alive and pauses it while you decide something.',
      run(f) {
        f.chip(1);
        for (let k = 0; k < 3; k++) {
          const a = 0.3 + k * 1.6;
          f.flow('to-max', a, a + 0.7);
          f.flow('in-user', a + 0.7, a + 1.3, { reverse: true });
        }
        f.lit('to-outbound', 'to-limiter', 'outbound', 'limiter');
        if (f.at(0.3)) f.lit('maxapi', 'to-max');
        if (f.at(1.0)) f.lit('user', 'in-user');
        f.screen('THINKING', 'typing_on → chat 4242 · every 2 s');
      },
    },
    {

    }
    const routes = {};
    for (const [id, e] of Object.entries(T.edges)) {
      if (!own(D.edges, id)) warn(`terminal: route for unknown edge "${id}"`);
      const cells = cellsOf(e.pts, id);
      routes[id] = cells;
      const last = cells[cells.length - 1], prevLast = cells[cells.length - 2] || last;
      const auto = last[0] < prevLast[0] ? '▲' : last[0] > prevLast[0] ? '▼' : last[1] < prevLast[1] ? '◄' : '►';
      cells.forEach(([y, x], k) => {
        if (y < 0 || x < 0 || y >= R || x >= C) return warn(`terminal: edge "${id}" leaves the grid at row ${y}, col ${x}`);
        const was = ownr[y][x];
        if (was.startsWith('n:')) warn(`terminal: edge "${id}" runs into box "${was.slice(2)}" at row ${y}, col ${x}`);
        else if (was) warn(`terminal: edges "${was.slice(2)}" and "${id}" share row ${y}, col ${x}`);
        const prev = cells[k - 1], next = cells[k + 1];
        const hz = e.dashed ? '╌' : '─', vt = e.dashed ? '╎' : '│';
        let g;
        if (!next) g = e.head || auto;
        else if (!prev) g = next[0] === y ? hz : vt;
        else if (prev[0] === y && next[0] === y) g = hz;
        else if (prev[1] === x && next[1] === x) g = vt;
        else {
          const up = prev[0] < y || next[0] < y, left = prev[1] < x || next[1] < x;
          g = up ? (left ? '┘' : '└') : left ? '┐' : '┌';
        }
        ch[y][x] = g;
        ownr[y][x] = 'e:' + id;
      });
      const touches = ([y, x]) => [[y - 1, x], [y + 1, x], [y, x - 1], [y, x + 1]].some(([a, b]) => (ownr[a] && ownr[a][b] || '').startsWith('n:'));
      if (!touches(cells[0])) warn(`terminal: edge "${id}" does not start next to a box`);
      if (!touches(last)) warn(`terminal: edge "${id}" does not end next to a box`);
    }
    return { ch, own: ownr, routes, hubId: hubId && T.boxes[hubId] ? hubId : null };
  }

  function hubRows(TL, D, f) {
    const [r, , h, w] = D.terminal.boxes[TL.hubId], n = D.nodes[TL.hubId], inner = w - 4, rows = [];
    let y = r + 3;
    const chips = D.terminal.chips || n.chips;
    if (chips) {
      rows.push([y, chips.map((x, k) => (k === f.chip ? `[${x}]` : ` ${x} `)).join(' ')]);
      y += 2;
    }
    const scr = f.term || (() => {
      const s = f.screen || [D.idle || '', ''];
      return [s[0], ...wrap(s[1], inner)];
    })();
    for (let k = 0; y + k <= r + h - 2; k++) rows.push([y + k, scr[k] || '']);
    return { rows, inner, overflow: scr.length > rows.length - (chips ? 1 : 0) };
  }

  function renderTerminal(TL, D, f, step) {
    const grid = TL.ch.map((row) => row.slice());
    const extra = new Map();
    if (TL.hubId) {
      const [r, c, , w] = D.terminal.boxes[TL.hubId], n = D.nodes[TL.hubId];
      const { rows, inner } = hubRows(TL, D, f);
      const fitL = (x) => (x.length > inner ? x.slice(0, inner - 1) + '…' : x.padEnd(inner, ' '));
      for (const [y, text] of rows) [...fitL(text)].forEach((x, j) => (grid[y][c + 2 + j] = x));
      if (n.status && f.status > 0.5) {
        const label = ` ${String(n.status).toUpperCase()} `.slice(0, w - 4), c0 = c + w - 2 - label.length;
        [...label].forEach((x, j) => {
          grid[r][c0 + j] = x;
          extra.set(`${r},${c0 + j}`, 'warm');
        });
      }
    }
    const packets = new Map();
    for (const p of f.packets) {
      const cells = TL.routes[p.edge];
      if (!cells) continue;
      const [y, x] = cells[Math.min(cells.length - 1, Math.round(p.f * (cells.length - 1)))];
      packets.set(`${y},${x}`, p.warm);
    }
    const hub = TL.hubId && D.terminal.boxes[TL.hubId];
    const state = (y, x) => {
      const key = `${y},${x}`;
      if (packets.has(key)) return packets.get(key) ? 'pkw' : 'pk';
      if (extra.has(key)) return extra.get(key);
      const o = TL.own[y][x];
      if (!o) return '';
      const id = o.slice(2), isNode = o[0] === 'n', def = isNode ? D.nodes[id] : D.edges[id];
      if (!def) return 'idle';
      if ((def.from || 0) > step) return 'hid';
      if (hub && id === TL.hubId && y > hub[0] && y < hub[0] + hub[2] - 1 && x > hub[1] && x < hub[1] + hub[3] - 1) return y === hub[0] + 1 ? 'on' : 'scr';
      if (f.on.has(id)) return def.warm ? 'warm' : 'on';
      return 'idle';
    };
    let html = '';
    for (let y = 0; y < grid.length; y++) {
      let run = '', s0 = null;
      const flush = () => {
        if (run) html += s0 ? `<span data-s="${s0}">${esc(run)}</span>` : esc(run);
        run = '';
      };
      for (let x = 0; x < grid[y].length; x++) {
        const st = state(y, x);
        if (st !== s0) {
          flush();
          s0 = st;
        }
        run += packets.has(`${y},${x}`) ? '●' : grid[y][x];
      }
      flush();
      html += '\n';
    }
    return html;
  }

  /* ---------- validator: warnings in the console, zero is the goal ---------- */
  function validate(D, TL, hubId) {
    const STEP = D.stepSeconds || 7, pool = D.maxPackets || 4;
    for (const id of Object.keys(D.nodes)) if (own(D.edges, id)) warn(`"${id}" is both a node and an edge id — make ids distinct`);
    for (const [key, L] of Object.entries(D.layouts)) {
      const boxes = Object.entries(L.nodes);
      for (const [id, b] of boxes) {
        if (!own(D.nodes, id)) warn(`${key}: box for unknown node "${id}"`);
        if (b.x < 0 || b.y < 0 || b.x + b.w > L.w || b.y + b.h > L.h) warn(`${key}: node "${id}" is outside the ${L.w}×${L.h} view box`);
      }
      for (let i = 0; i < boxes.length; i++) {
        for (let j = i + 1; j < boxes.length; j++) {
          const [a, A] = boxes[i], [b, B] = boxes[j];
          if (A.x < B.x + B.w && B.x < A.x + A.w && A.y < B.y + B.h && B.y < A.y + A.h) warn(`${key}: nodes "${a}" and "${b}" overlap`);
        }
      }
      const onBorder = (p, b) =>
        ((Math.abs(p[0] - b.x) < 1.01 || Math.abs(p[0] - b.x - b.w) < 1.01) && p[1] >= b.y - 1 && p[1] <= b.y + b.h + 1) ||
        ((Math.abs(p[1] - b.y) < 1.01 || Math.abs(p[1] - b.y - b.h) < 1.01) && p[0] >= b.x - 1 && p[0] <= b.x + b.w + 1);
      const badges = [];
      for (const [id, pts] of Object.entries(L.edges)) {
        if (!own(D.edges, id)) warn(`${key}: geometry for unknown edge "${id}"`);
        if (pts.length < 2) {
          warn(`${key}: edge "${id}" needs at least two points`);
          continue;
        }
        if (!boxes.some(([, b]) => onBorder(pts[0], b))) warn(`${key}: edge "${id}" starts at ${pts[0]}, not on a node border`);
        if (!boxes.some(([, b]) => onBorder(pts[pts.length - 1], b))) warn(`${key}: edge "${id}" ends at ${pts[pts.length - 1]}, not on a node border`);
        for (let k = 1; k < pts.length; k++) {
          const a = pts[k - 1], b = pts[k];
          if (a[0] !== b[0] && a[1] !== b[1]) warn(`${key}: edge "${id}" has a diagonal segment ${a} → ${b}`);
          const x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]), y0 = Math.min(a[1], b[1]), y1 = Math.max(a[1], b[1]);
          for (const [nid, B] of boxes) {
            if (x1 > B.x + 1 && x0 < B.x + B.w - 1 && y1 > B.y + 1 && y0 < B.y + B.h - 1) warn(`${key}: edge "${id}" passes through node "${nid}"`);
          }
        }
        const e = D.edges[id];
        if (e && e.num && L.numbers !== false) badges.push([id, L.badges && own(L.badges, id) ? L.badges[id] : longestMid(pts)]);
      }
      for (let i = 0; i < badges.length; i++) {
        for (let j = i + 1; j < badges.length; j++) {
          const [a, P] = badges[i], [b, Q] = badges[j];
          if (P && Q && Math.hypot(P[0] - Q[0], P[1] - Q[1]) < 22) warn(`${key}: step badges of "${a}" and "${b}" collide — move one with layout.badges`);
        }
      }
      const hub = hubId && L.nodes[hubId] ? hubParts(L.nodes[hubId], D.nodes[hubId]) : null;
      if (hub) {
        D.steps.forEach((_, i) => {
          for (let t = 0; t <= STEP; t += 0.25) {
            const f = frameAt(D, i, t);
            const s = f.screen || [D.idle || '', ''];
            if (wrap(s[1], hub.wrapN).length > hub.lines) warn(`${key}: step ${i + 1} screen text "${s[1]}" needs more than ${hub.lines} lines`);
          }
        });
      }
    }
    for (const { text, size, where } of fits) if (size < 9) warn(`${where}: label "${text}" shrinks to ${size}px — shorten it or widen the box`);
    D.steps.forEach((s, i) => {
      if (!s.title || !s.text) warn(`step ${i + 1} needs a title and a text`);
      for (let t = 0; t <= STEP; t += 0.05) {
        const f = frameAt(D, i, t);
        if (f.packets.length > pool) warn(`step ${i + 1}: ${f.packets.length} packets at t=${t.toFixed(2)} — the pool holds ${pool} (maxPackets)`);
        if (TL && TL.hubId && hubRows(TL, D, f).overflow) warn(`terminal: step ${i + 1} screen text does not fit the hub box at t=${t.toFixed(2)}`);
      }
    });
  }

  function switchHtml(L) {
    const jaws = [39.5, 80.5]
      .map((x, i) => `<g class="k-jaw" data-side="${i ? 'terminal' : 'scheme'}"><rect x="${x - 5}" y="12" width="2.6" height="12" rx="1"/><rect x="${x + 2.4}" y="12" width="2.6" height="12" rx="1"/><rect x="${x - 5}" y="22" width="10" height="18" rx="1.5"/></g>`)
      .join('');
    return `<button type="button" class="fl-knife" role="switch" aria-checked="false" aria-label="${esc(L.aria)}">
      <span class="fl-kl" data-side="scheme">${esc(L.scheme)}</span>
      <svg viewBox="0 0 120 64" aria-hidden="true">
        <rect x="6" y="40" width="108" height="20" rx="4" class="k-base"/>
        <circle cx="14" cy="50" r="1.6" class="k-screw"/><circle cx="106" cy="50" r="1.6" class="k-screw"/>
        ${jaws}
        <rect x="54" y="38" width="12" height="10" rx="2" class="k-hinge"/>
        <g class="k-blade"><rect x="58" y="9" width="4" height="36" rx="1.5"/><rect x="53" y="5" width="14" height="7" rx="3.5" class="k-handle"/></g>
        <circle cx="60" cy="43" r="2.2" class="k-pin"/>
        <circle cx="39.5" cy="16" r="7" class="k-spark"/>
      </svg>
      <span class="fl-kl" data-side="terminal">${esc(L.terminal)}</span>
    </button>`;
  }

  function mount(root, D) {
    const q = new URLSearchParams(location.search);
    if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
    if (q.get('skin')) root.dataset.skin = q.get('skin');
    const prefix = 'fl' + ++uid;
    const STEP = D.stepSeconds || 7, HOLD = D.holdSeconds || 14, N = D.steps.length;
    const fam = getComputedStyle(root).fontFamily;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const wideMq = matchMedia(BREAK);
    const hubId = Object.keys(D.nodes).find((k) => D.nodes[k].screen) || null;
    const hasTerm = !!(D.terminal && D.switcher);
    if (D.layouts.tall) root.setAttribute('data-has-tall', '');

    root.innerHTML = `
      <div class="fl-bar"><span class="fl-readout" aria-hidden="true"></span>${hasTerm ? switchHtml(D.switcher) : ''}</div>
      <div class="fl-plate" data-view="scheme">
        ${Object.keys(D.layouts).map((k) => svgFor(D, k, fam, prefix, hubId)).join('')}
        ${hasTerm ? `<div class="fl-crt" role="img" aria-label="${esc(D.label)}" hidden><pre class="fl-pre" aria-hidden="true"></pre><div class="fl-typed" aria-hidden="true"></div></div>` : ''}
      </div>
      <ol class="fl-steps" aria-label="${esc(D.stepsAria || 'Steps')}">
        ${D.steps.map((s, i) => `<li><button type="button" data-step="${i}" aria-pressed="false"><span class="fl-n">${i + 1}</span>${esc(s.title)}</button></li>`).join('')}
      </ol>
      <p class="fl-caption" aria-live="polite"></p>`;

    const svgs = Object.fromEntries([...root.querySelectorAll('.fl-svg')].map((s) => [s.dataset.layout, refsOf(s)]));
    const plate = root.querySelector('.fl-plate'), crt = root.querySelector('.fl-crt');
    const pre = root.querySelector('.fl-pre'), typed = root.querySelector('.fl-typed');
    const readout = root.querySelector('.fl-readout'), caption = root.querySelector('.fl-caption');
    const buttons = [...root.querySelectorAll('[data-step]')], knife = root.querySelector('.fl-knife');
    const TL = hasTerm ? terminalOf(D, hubId) : null;
    if (pre) pre.style.setProperty('--cols', D.terminal.cols);
    validate(D, TL, hubId);

    const still = reduce || q.has('still');
    const tParam = q.has('t') ? parseFloat(q.get('t')) : null;
    const startStep = Math.min(N, Math.max(1, parseInt(q.get('step') || '1', 10) || 1)) - 1;
    const clock = { step: startStep, t: tParam !== null ? tParam : still ? STEP * 0.8 : 0, hold: q.has('step') ? HOLD : 0 };
    let view = 'scheme', lastTerm = 0;

    const activeSvg = () => svgs[wideMq.matches || !svgs.tall ? 'wide' : 'tall'];
    function draw(force) {
      const { step, t } = clock;
      const f = frameAt(D, step, t);
      if (view === 'scheme') return paint(activeSvg(), D, f, step);
      const now = performance.now();
      if (!force && now - lastTerm < 45) return; // the terminal is rebuilt whole: ~20 fps is plenty
      lastTerm = now;
      pre.innerHTML = renderTerminal(TL, D, f, step);
      const text = D.steps[step].text;
      typed.textContent = '> ' + (still ? text : text.slice(0, Math.floor(t * 46)));
    }
    function showStep() {
      const i = clock.step;
      readout.textContent = `${D.stepWord || 'STEP'} ${i + 1}/${N}`;
      buttons.forEach((b, k) => {
        b.setAttribute('aria-pressed', String(k === i));
        b.toggleAttribute('data-on', k === i);
      });
      caption.textContent = D.steps[i].text;
    }
    function setView(v, sparkle = true) {
      view = v;
      plate.dataset.view = v;
      caption.dataset.view = v;
      if (crt) crt.hidden = v !== 'terminal';
      if (knife) knife.setAttribute('aria-checked', String(v === 'terminal'));
      if (knife && sparkle) {
        const spark = knife.querySelector('.k-spark');
        spark.setAttribute('cx', v === 'terminal' ? '80.5' : '39.5');
        spark.classList.remove('go');
        void spark.getBoundingClientRect();
        spark.classList.add('go');
      }
      draw(true);
    }
    buttons.forEach((b) =>
      b.addEventListener('click', () => {
        clock.step = +b.dataset.step;
        clock.t = still ? STEP * 0.8 : 0;
        clock.hold = HOLD; // replay the picked step before the tour moves on
        showStep();
        draw(true);
      })
    );
    if (knife) knife.addEventListener('click', () => setView(view === 'scheme' ? 'terminal' : 'scheme'));
    wideMq.addEventListener('change', () => draw(true));

    showStep();
    setView(q.get('view') === 'terminal' && TL ? 'terminal' : 'scheme', false);
    if (still) return;

    let frame = 0, last = 0, visible = false;
    const tick = (now) => {
      const dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
      last = now;
      clock.t += dt;
      if (clock.hold > 0) clock.hold -= dt;
      if (clock.t > STEP) {
        clock.t = 0;
        if (clock.hold <= 0) {
          clock.step = (clock.step + 1) % N;
          showStep();
        }
      }
      draw(false);
      frame = visible ? requestAnimationFrame(tick) : 0;
    };
    // stop when off screen: a looping figure must not burn CPU below the fold
    new IntersectionObserver(
      (entries) => {
        visible = entries[entries.length - 1].isIntersecting;
        if (visible && !frame) {
          last = 0;
          frame = requestAnimationFrame(tick);
        }
      },
      { rootMargin: '120px 0px' }
    ).observe(root);
  }

  return { mount, frameAt, ICONS };
})();

FlowDiagram.mount(document.getElementById('max-flow'), DIAGRAM);
</script>
</body>
</html>
