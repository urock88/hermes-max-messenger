name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests · Hermes ${{ matrix.hermes }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor in plugin.yaml, and the newest Hermes (allowed to fail: it may change under us).
        hermes: ["v0.22.6", "main"]
    continue-on-error: ${{ matrix.hermes == 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin

      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"  # Hermes pins its dependencies for Python 3.14

      # Hermes installs only through uv: its pins conflict on purpose (browser-harness wants
      # Pillow 12, Hermes pins 13) and the conflict is settled by [tool.uv] override-dependencies,
      # which pip does not read. Install exactly what Hermes' uv.lock says, then the plugin on top.
      - name: Install Hermes and the plugin's test dependencies
        run: |
          python -m pip install --upgrade uv
          (cd hermes-agent && uv sync --frozen --python "$(command -v python)")
          uv pip install --python hermes-agent/.venv/bin/python -e "./plugin[dev,tables]"
          echo "$GITHUB_WORKSPACE/hermes-agent/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        working-directory: plugin
        run: ruff check .

      - name: Tests
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: pytest -q

      - name: Hermes catalog validation
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: |
          export HERMES_HOME="$(mktemp -d)"
          python - <<'EOF'
          import sys
          from pathlib import Path
          from hermes_cli.plugin_validate import validate_plugin_dir
          report = validate_plugin_dir(Path("plugin"))
          for name, ok, detail in report.checks:
              print(("ok  " if ok else "FAIL"), name, "-", detail)
          for warning in report.warnings:
              print("WARN", warning)
          sys.exit(0 if report.ok else 1)
          EOF

      - name: Docs match the code
        working-directory: plugin
        run: python scripts/check_config_reference.py

      - name: Desktop plugin parses
        working-directory: plugin
        run: node --check desktop/plugin.js
